<!doctype html>
<html>
<head><meta charset="utf-8" /><title>fixture — filament admin (v4 markup real)</title></head>
<body>
  <!-- Sidebar: grupo colapsado (display:none) — los <a href> SIGUEN en el DOM (design §2bis). -->
  <aside class="fi-sidebar">
    <ul>
      <li class="fi-sidebar-group" data-group-label="Catálogo">
        <ul style="display: none;">
          <li class="fi-sidebar-item">
            <!-- Filament renderiza hrefs ABSOLUTOS (hallazgo de Fase 2): el fixture tiene que imitarlo -->
            <a class="fi-sidebar-item-btn" href="http://localhost/admin/products">Products</a>
          </li>
          <li class="fi-sidebar-item">
            <a class="fi-sidebar-item-btn" href="/admin/colours-page">Colours</a>
          </li>
          <li class="fi-sidebar-item">
            <!-- una Page anidada (ManageConfiguratorPage): NO es un Resource -->
            <a class="fi-sidebar-item-btn" href="http://localhost/admin/customized-solutions/configurator">Configurator</a>
          </li>
        </ul>
      </li>
      <li class="fi-sidebar-item">
        <a class="fi-sidebar-item-btn" href="/admin">Dashboard</a>
      </li>
    </ul>
  </aside>

  <!-- Form: 3 tipos de campo (text-input, select, toggle) + 1 repeater con block labels. -->
  <form>
    <!-- Markup REAL de Filament 4 (capturado de prolicht, hallazgo de Fase 2): el tipo vive en un div
         intermedio (fi-input-wrp fi-fo-text-input), el input trae wire:model CON modificador y id form.<campo> -->
    <div data-field-wrapper="" class="fi-fo-field">
      <div class="fi-fo-field-label-col">
        <div class="fi-fo-field-label-ctn">
          <label for="form.name" class="fi-fo-field-label">
            <span class="fi-fo-field-label-content">Nombre<sup class="fi-fo-field-label-required-mark">*</sup></span>
          </label>
        </div>
      </div>
      <div class="fi-fo-field-content-col">
        <div class="fi-input-wrp fi-fo-text-input">
          <div class="fi-input-wrp-content-ctn"><input id="form.name" type="text" wire:model.blur="data.name" class="fi-input" /></div>
        </div>
      </div>
    </div>
    <div data-field-wrapper="" class="fi-fo-field">
      <div class="fi-fo-field-label-col"><label class="fi-fo-field-label"><span class="fi-fo-field-label-content">Categoría</span></label></div>
      <div class="fi-fo-field-content-col">
        <div class="fi-input-wrp fi-fo-select"><select id="form.category" wire:model.live="data.category" class="fi-select-input"></select></div>
      </div>
    </div>
    <div data-field-wrapper="" class="fi-fo-field">
      <div class="fi-fo-field-label-col"><label class="fi-fo-field-label"><span class="fi-fo-field-label-content">Activo</span></label></div>
      <div class="fi-fo-field-content-col">
        <!-- el toggle de Filament no es un <input>: es un button[role=switch] con x-data -->
        <button type="button" role="switch" aria-checked="false" id="form.active" x-data="{}" class="fi-fo-toggle"></button>
      </div>
    </div>
    <div class="fi-fo-field" data-field-wrapper>
      <label class="fi-fo-field-label-content">Galería</label>
      <input type="hidden" name="gallery" class="fi-fo-repeater" />
      <li class="fi-fo-repeater-item"></li>
      <li class="fi-fo-repeater-item"></li>
      <div class="fi-fo-builder-item-header-label">Imagen</div>
    </div>
  </form>

  <!-- Tabla: filas reales de datos + summary row (NO debe matchear el selector) + paginación. -->
  <table>
    <tbody>
      <tr class="fi-ta-row" wire:key="table.records.1">
        <td><a class="fi-ta-col" href="/admin/products/1/edit">Producto 1</a></td>
      </tr>
      <tr class="fi-ta-row" wire:key="table.records.2">
        <td><a class="fi-ta-col" href="/admin/products/2/edit">Producto 2</a></td>
      </tr>
      <tr class="fi-ta-row fi-ta-summary-row" wire:key="table.summary">
        <td>Total</td>
      </tr>
    </tbody>
  </table>
  <nav class="fi-pagination">
    <span class="fi-pagination-overview">Showing 1 to 2 of 2 results</span>
  </nav>
</body>
</html>
