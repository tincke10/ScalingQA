services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: testdb
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  laravel-app:
    build:
      context: ./backend-laravel
      secrets:
        - composer_auth
    environment:
      APP_ENV: local
      # Clave fija de TEST: este entorno no maneja secretos reales (credenciales test/test versionadas)
      APP_KEY: "base64:PHVjahEC4U8fyX6foM45fcL3sGDuABuH6WeVLRV6Ofg="
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: testdb
      DB_USERNAME: test
      DB_PASSWORD: test
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend-vue:
    build: ./frontend-vue
    depends_on:
      laravel-app:
        condition: service_healthy
    healthcheck:
      # nginx:alpine trae wget de busybox, no curl; 127.0.0.1 explícito porque
      # localhost en alpine resuelve primero a ::1
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend-vue-test:
    profiles: [unit]
    build:
      context: ./frontend-vue
      target: base
    command: ["npm", "run", "test:unit", "--", "--run"]

  frontend-react:
    build: ./frontend-react
    depends_on:
      laravel-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend-react-test:
    profiles: [unit]
    build:
      context: ./frontend-react
      target: base
    command: ["npm", "run", "test:unit", "--", "--run"]

  playwright-runner:
    profiles: [e2e]
    # La versión DEBE coincidir exacto con @playwright/test en tests/e2e/package.json
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /work
    volumes:
      - ./tests/e2e:/work
      - ./artifacts:/artifacts
    environment:
      BASE_URL_VUE: http://frontend-vue
      BASE_URL_REACT: http://frontend-react
      API_URL: http://laravel-app:8000
      RUN_ID: ${RUN_ID:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      DB_ENGINE: mysql
      CI: "true"
      # filtro opcional: security-scan corre solo el spec de headers con PW_GREP
      PW_GREP: ${PW_GREP:-}
      # Capa 3 apunta el runner a ./generated (specs adversariales) en vez de ./tests
      TEST_DIR: ${TEST_DIR:-./tests}
    depends_on:
      frontend-vue:
        condition: service_healthy
      frontend-react:
        condition: service_healthy
    # Sin `playwright install`: los browsers ya vienen en la imagen oficial
    command: ["bash", "-c", "npm ci --loglevel=error && npx playwright test ${PW_GREP:+--grep \"$PW_GREP\"}"]

  # Preflight: ¿el target está listo para testear? Habla el Docker Engine API por el socket
  # montado — sin CLI de docker adentro de la imagen. Para un target remoto se pasa
  # DOCKER_HOST=tcp://server:2375 y es exactamente el mismo código.
  preflight:
    profiles: [preflight]
    build: ./preflight
    extra_hosts:
      # el localhost del HOST no es el localhost de este container: los targets locales se
      # apuntan a host.docker.internal
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./artifacts:/artifacts
      - ./targets:/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      SCALINGQA_CONFIG: /config/${TARGET:-prolicht}.yml
      RUN_ID: ${RUN_ID:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      DOCKER_HOST: ${DOCKER_HOST:-}

  preflight-test:
    profiles: [unit]
    build:
      context: ./preflight
      target: base
    command: ["npx", "vitest", "run"]

  # Sweep diferencial del admin del target (Capa A/B/C). Mismo patrón que playwright-runner
  # (imagen oficial + volúmenes + npm ci en el command): sin Dockerfile de runtime, así la
  # versión de Playwright tiene UNA sola fuente de verdad.
  sweep:
    profiles: [sweep]
    image: mcr.microsoft.com/playwright:v1.62.1-noble   # DEBE coincidir con sweep/package.json
    working_dir: /work
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./sweep:/work
      - ./preflight:/preflight:ro           # espeja el árbol: `../../preflight/src/config` resuelve igual adentro que afuera
      - ./security-agent:/security-agent:ro # solo Capa B: el LlmProvider
      - ./tests/e2e:/e2e                    # Capa B escribe la cuarentena acá
      - ./artifacts:/artifacts
      - ./targets:/config:ro
      - ${MATRIX_DIR:-./targets}:/matrix:ro  # Capa B: la matriz del target, SIEMPRE :ro
    environment:
      SCALINGQA_CONFIG: /config/${TARGET:-prolicht}.yml
      MODE: ${MODE:-crawl}                  # crawl | diff | generate | areas
      VARIANT: ${VARIANT:-baseline}
      BASELINE: ${BASELINE:-}
      ADMIN_E2E_USER: ${ADMIN_E2E_USER:-}   # desde .env (gitignored), igual que DEEPSEEK_API_KEY
      ADMIN_E2E_PASS: ${ADMIN_E2E_PASS:-}
      RUN_ID: ${RUN_ID:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      TARGET_SHA: ${TARGET_SHA:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    command: ["bash", "-c", "npm ci --loglevel=error && npm run start"]

  sweep-test:
    profiles: [unit]
    build: { context: ., dockerfile: ./sweep/Dockerfile, target: base }   # contexto = root: copia preflight/
    command: ["npx", "vitest", "run"]

  # Dashboard: historial de corridas (contrato de artefactos) + preflight EN VIVO.
  # Sin base de datos: el estado vive en el filesystem, el mismo que consume CI.
  dashboard:
    profiles: [dashboard]
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
    ports:
      - "${DASHBOARD_PORT:-8088}:8080"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./artifacts:/artifacts:ro
      - ./qa-suggestions:/qa-suggestions:ro
      - ./targets:/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOCKER_HOST: ${DOCKER_HOST:-}

  dashboard-test:
    profiles: [unit]
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
      target: base
    command: ["npx", "vitest", "run"]

  dashboard-web-test:
    profiles: [unit]
    build:
      context: .
      dockerfile: ./dashboard/Dockerfile
      target: web-build
    command: ["npx", "vitest", "run"]

  qa-agent:
    profiles: [qa]
    build: ./qa-agent
    volumes:
      - ./artifacts:/artifacts:ro
      - ./qa-suggestions:/qa-suggestions
    environment:
      RUN_ID: ${RUN_ID:-dev}
      # Opcional: sin API key el análisis determinista corre igual
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  qa-agent-test:
    profiles: [unit]
    build:
      context: ./qa-agent
      target: base
    command: ["npx", "vitest", "run"]

  # Capa 1 de seguridad: discovery de workflows con LLM (DeepSeek). Requiere API key.
  security-agent:
    profiles: [discover]
    build: ./security-agent
    volumes:
      - ./artifacts:/artifacts
      - ./tests/e2e:/e2e
      - ./qa-suggestions:/qa-suggestions
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      GIT_SHA: ${GIT_SHA:-unknown}
      RUN_ID: ${RUN_ID:-dev}

  security-agent-test:
    profiles: [unit]
    build:
      context: ./security-agent
      target: base
    command: ["npx", "vitest", "run"]

  k6-runner:
    profiles: [load]
    image: grafana/k6:2.2.0
    working_dir: /tests
    volumes:
      - ./tests/load:/tests
      - ./artifacts:/artifacts
    depends_on:
      laravel-app:
        condition: service_healthy
    # k6 no crea el directorio de salida y NO falla si handleSummary no puede escribir:
    # se crea antes y se verifica después, para que un artefacto faltante sea un fallo real
    environment:
      API_URL: http://laravel-app:8000
      RUN_ID: ${RUN_ID:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      DB_ENGINE: mysql
      SCENARIO: ${SCENARIO:-scenario_tasks_auth.js}
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p "/artifacts/load/$${RUN_ID}" &&
        k6 run "/tests/$${SCENARIO}" &&
        test -f "/artifacts/load/$${RUN_ID}/summary.json" &&
        test -f "/artifacts/load/$${RUN_ID}/meta.json"

# Secret de build OPCIONAL para composer. En CI se puebla desde COMPOSER_AUTH (con el
# GITHUB_TOKEN de Actions); en local la env var no existe y el build descarga anónimo.
secrets:
  composer_auth:
    environment: COMPOSER_AUTH
