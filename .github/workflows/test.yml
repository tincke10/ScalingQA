name: test

on:
  push:
    branches: [main]
  pull_request:

# Le da a composer el GITHUB_TOKEN automático de Actions (via el build secret composer_auth),
# para no pegar al rate limit anónimo de la API de GitHub — causa de los HTTP 504 al bajar deps.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  # El motor de DB es una dimensión explícita: un job por motor, en paralelo
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, pgsql]
    steps:
      - uses: actions/checkout@v4
      - run: make test-${{ matrix.engine }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make test-unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make test-e2e
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: artifacts/
          if-no-files-found: ignore

  # Seguridad Capa 0: determinista, sin LLM ni credenciales. Corre en cada PR.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make security-scan
